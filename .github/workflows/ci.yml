name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      # Keep the legacy combined artifact while the default-branch reporter
      # is still pinned to the older Benchmark release during this PR.
      # These are uploads of existing results: tests never run twice.
      - name: Upload legacy Benchmark report inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci
          path: |
            junit.xml
            lcov.info
          if-no-files-found: ignore

      # Exercise the new Benchmark independent-artifact resolution in a
      # separate trusted workflow_run publisher after this PR is merged.
      - name: Upload Benchmark JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-junit
          path: junit.xml
          if-no-files-found: ignore

      - name: Upload Benchmark LCOV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-lcov
          path: lcov.info
          if-no-files-found: ignore

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
