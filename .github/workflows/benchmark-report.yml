# Trusted post-CI reporting. Runs only from the default branch after CI;
# never checks out or executes fork PR code with the comment-write token.
name: Benchmark PR Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    uses: affank1020/benchmark/.github/workflows/reusable-report.yml@bff973c94597897c095f76e0538ec145d7ecdc45
    with:
      # Legacy combined artifact remains until the rollout is accepted.
      artifact_name: benchmark-ci
      tests_artifact_name: benchmark-junit
      coverage_artifact_name: benchmark-lcov
